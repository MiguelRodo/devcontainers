version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      routine-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      routine-devcontainers:
        patterns:
          - "*"

  # The projcli image lives on its own long-lived branch, like other variants.
  - package-ecosystem: "devcontainers"
    directory: "/"
    target-branch: "projcli"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      projcli-devcontainers:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "projcli"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      projcli-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    target-branch: "projcli"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    groups:
      projcli-base-image:
        patterns:
          - "*"
