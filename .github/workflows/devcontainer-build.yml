name: 'Pre-build Dev Container'

on:
  push:
    tags:
      - 'v*'
      - '*-v*'
  workflow_dispatch:
    inputs:
      target_branch: 
        description: 'Branch to check out and build'
        required: true
        default: 'main'
        type: string
      bump_type:
        description: 'Version component to bump (major, minor, patch)'
        required: false
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      version:
        description: 'Exact version to build (e.g. v1.2.3). Leave blank if using bump_type.'
        required: false
        type: string
      no_cache:
        description: 'Disable Docker cache during build.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Run Dev Container Prebuild
        uses: MiguelRodo/actions/prebuild-devcontainer@ea8f8df62048a1ae56a1e99a58580a0ac05b8e41 # v2.43.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          target_branch: ${{ inputs.target_branch }}
          bump_type: ${{ github.event.inputs.bump_type }}
          version: ${{ github.event.inputs.version }}
          no_cache: ${{ github.event.inputs.no_cache }}
